name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test suite (offline, no API keys — SPEC §13)
        run: pytest
      - name: Style gates
        run: pytest tests/style -v
      - name: Quickstart (every phase, end to end)
        run: python examples/quickstart.py

      # An example that no longer runs is a published lie about the package's
      # surface. `pytest` never executes one, so this is the gate.
      - name: Examples (every recipe under examples/, offline)
        run: bash scripts/run_examples.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # release_check.sh calls `python -m build` and `python -m twine`; neither
      # is on a bare runner, so this job failed at its second step on EVERY
      # pull request — including ones that touched nothing but config. The
      # release gate has been reporting a red X for a missing dependency
      # rather than for anything about the release.
      - name: Install packaging tools
        run: python -m pip install --quiet --upgrade build twine
      - name: Release check (build, twine, wheel contents, fresh-venv smoke)
        run: bash scripts/release_check.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image and run the suite in a network-less container
        run: |
          docker build --target test -t auradefi:ci-test .
          docker run --rm --network none auradefi:ci-test
      - name: Build runtime image and run the quickstart demo
        run: |
          docker build -t auradefi:ci .
          docker run --rm --network none auradefi:ci
      - name: Execute every PyBook inside the network-less container
        run: |
          docker run --rm --network none auradefi:ci-test \
            bash -c 'for nb in docs/books/*.ipynb; do echo "== $nb"; jupyter execute "$nb" || exit 1; done'

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Execute PyBooks headlessly so the docs cannot rot
        run: bash scripts/run_books.sh
