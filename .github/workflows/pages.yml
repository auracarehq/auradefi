name: pages

# Publish docs/ + examples/ + the PyBooks to GitHub Pages.
#
# The build EXECUTES every example and every notebook first, and captures
# their real output onto the pages. So this workflow cannot publish a page
# whose code does not run: a broken example fails the deploy instead of
# going stale on the web, which is the whole point of shipping executable
# documentation.

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "examples/**"
      - "scripts/build_site.py"
      - "scripts/site_render.py"
      - "scripts/site_style.css"
      - "src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one half-done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # [dev] so the notebooks and the [sql]/[api] examples can run; [docs]
      # for the two rendering libraries the builder needs.
      - name: Install
        run: python -m pip install --quiet -e ".[dev,docs]"

      # Re-execute the books in place so the published outputs are the ones
      # THIS commit produces, not whatever was committed.
      - name: Execute the PyBooks
        run: BOOKS_INPLACE=1 bash scripts/run_books.sh

      - name: Build the site
        run: python scripts/build_site.py

      - name: Refuse to publish a broken link
        run: python scripts/check_site_links.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
