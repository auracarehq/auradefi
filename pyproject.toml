[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auradefi"
version = "0.1.1"
description = "Open-source multi-tenant crypto data aggregator: Vezgo-style tenancy, DeBank-style DeFi depth, Plaid wire format. Library first, service second."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Auracare", email = "stephen@auracare.org.uk" }]
keywords = [
  "crypto", "defi", "portfolio", "plaid", "caip", "caip-19",
  "multi-tenant", "aggregator", "wallet", "blockchain",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
sql = ["sqlmodel>=0.0.16"]
api = ["fastapi>=0.115"]
# Everything `scripts/build_site.py` needs. Notebooks are read as JSON and
# pages are plain strings, so there is no site generator and no template
# engine here: markdown-it-py renders prose, Pygments colours code.
docs = ["markdown-it-py>=3", "Pygments>=2.17"]
dev = [
  "fastapi>=0.115",
  "pytest>=8",
  "pytest-cov",
  "build",
  "twine",
  "nbformat",
  "nbclient",
  "ipykernel",
  "sqlmodel>=0.0.16",
]

[project.urls]
Homepage = "https://github.com/auracarehq/auradefi"
Documentation = "https://auracarehq.github.io/auradefi/"
Source = "https://github.com/auracarehq/auradefi"
Issues = "https://github.com/auracarehq/auradefi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/auradefi"]

[tool.hatch.build.targets.sdist]
include = [
  "src/auradefi", "tests", "docs", "examples", "scripts",
  "README.md", "CHANGELOG.md", "LICENSE", ".env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
filterwarnings = ["error::DeprecationWarning:auradefi.*"]
