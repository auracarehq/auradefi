[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auradefi"
version = "0.1.0"
description = "Open-source multi-tenant crypto data aggregator: Vezgo-style tenancy, DeBank-style DeFi depth, Plaid wire format. Library first, service second."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Auracare", email = "stephen@auracare.org.uk" }]
keywords = [
  "crypto", "defi", "portfolio", "plaid", "caip", "caip-19",
  "multi-tenant", "aggregator", "wallet", "blockchain",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov",
  "build",
  "twine",
  "nbformat",
  "nbclient",
  "ipykernel",
]

[project.urls]
Homepage = "https://github.com/auracarehq/auradefi"
Source = "https://github.com/auracarehq/auradefi"
Issues = "https://github.com/auracarehq/auradefi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/auradefi"]

[tool.hatch.build.targets.sdist]
include = ["src/auradefi", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
filterwarnings = ["error::DeprecationWarning:auradefi.*"]
